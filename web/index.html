<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雷霆战机 · 雷电风格射击</title>
<style>
:root {
  --daimon-widget-host-safe-inline-end: 190px;
  --daimon-widget-host-safe-block-start: 44px;
}
.kimi-host-safe-context { container-type: inline-size; }
.kimi-host-safe-header {
  box-sizing: border-box;
  min-block-size: var(--daimon-widget-host-safe-block-start, 44px);
  padding-inline-end: var(--daimon-widget-host-safe-inline-end, 190px);
}
@container (max-width: 419px) {
  .kimi-host-safe-header {
    min-block-size: 0;
    padding-block-start: var(--daimon-widget-host-safe-block-start, 44px);
    padding-inline-end: 0;
  }
}
[data-kimi-root] { box-sizing: border-box; inline-size: 100%; min-inline-size: 0; max-inline-size: 100%; overflow: visible; }
[data-kimi-root] * { box-sizing: border-box; min-inline-size: 0; }
html[data-daimon-size-tier="compact"] [data-kimi-priority="p1"],
html[data-daimon-size-tier="compact"] [data-kimi-priority="p2"],
html[data-daimon-size-tier="compact"] [data-kimi-priority="p3"] { display: none !important; }

html, body { margin: 0; padding: 0; }
body {
  font-family: var(--kimi-font-sans);
  color: var(--kimi-color-text-primary);
  letter-spacing: 0;
}
h1 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3; }
h1 .sub { font-size: 12px; font-weight: 500; color: var(--kimi-color-text-tertiary); margin-inline-start: 6px; }
header.kimi-host-safe-header { padding-block-start: 8px; padding-block-end: 6px; }
p.status { margin: 2px 0 0; font-size: 12px; color: var(--kimi-color-text-secondary); line-height: 1.5; }
p.status output { font-weight: 700; color: var(--kimi-color-text-primary); font-variant-numeric: tabular-nums; }
.stage {
  inline-size: 100%;
  max-inline-size: 480px;
  margin-inline: auto;
  aspect-ratio: 3 / 4;
  max-block-size: 520px;

.stage canvas {

.stage canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--kimi-color-accent); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-block-start: 8px; }
.controls button {

  border: 1px solid var(--kimi-color-border);

.controls button:focus-visible { outline: 2px solid var(--kimi-color-accent); outline-offset: 2px; }

@media (min-width: 760px) {
  .stage { max-inline-size: 480px; max-block-size: 600px; }
}
</style>
</head>
<body>
<main class="kimi-host-safe-context" data-kimi-root>
  <header class="kimi-host-safe-header" data-kimi-priority="p0">
    <h1>雷霆战机<span class="sub">雷电风格 · 纵版弹幕射击</span></h1>
    <p class="status" role="status">得分 <output id="oScore">0</output> · 最高 <output id="oHi">0</output> · 波次 <output id="oWave">—</output> · 生命 <output id="oLives">3</output> · 炸弹 <output id="oBombs">3</output> · 武器 <output id="oWeapon">火神炮 Lv1</output></p>
  </header>
  <div class="stage" data-kimi-priority="p0">
    <canvas id="game" width="480" height="640" tabindex="0" role="application" aria-label="雷霆战机游戏画面。1P 用 WASD 移动、空格放炸弹，2P 用方向键移动、回车放炸弹。"></canvas>
  </div>
  <div class="controls" data-kimi-priority="p1">
    <button id="btnStart" type="button" class="primary">开始游戏</button>
    <button id="btnPause" type="button" disabled>暂停</button>
    <button id="btnSound" type="button" aria-pressed="true">音效：开</button>
    <button id="btnMusic" type="button" aria-pressed="true">音乐：开</button>
  </div>
  <p class="help" data-kimi-priority="p2">1P：WASD / 方向键移动 · 空格 / X 炸弹　｜　2P：方向键移动 · 回车炸弹　｜　P / Esc 暂停菜单 · Game Over 按 C 续命 · 双人贴身 0.6 秒触发 FUSION 合体 · 触屏拖动移动、双击炸弹。菜单可选单人 / 双人 / 关卡选择 / 四档难度 / 设置 / 排行榜，全 4 大关卡，击败每关关底 Boss 推进，通关后开启无尽挑战。</p>
<script>
(function () {
'use strict';
var W = 480, H = 640, TAU = Math.PI * 2;
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
var oScore = document.getElementById('oScore');
var oHi = document.getElementById('oHi');
var oWave = document.getElementById('oWave');
var oLives = document.getElementById('oLives');
var oBombs = document.getElementById('oBombs');
var oWeapon = document.getElementById('oWeapon');
var btnStart = document.getElementById('btnStart');
var btnPause = document.getElementById('btnPause');
var btnSound = document.getElementById('btnSound');
var btnMusic = document.getElementById('btnMusic');
var reduceMotion = false;
try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function angleLerp(cur, des, maxTurn) {
  var d = ((des - cur + Math.PI * 3) % TAU) - Math.PI;
  return cur + clamp(d, -maxTurn, maxTurn);
}

/* ---------------- audio: sfx ---------------- */
var AC = null, master = null, musicGain = null, soundOn = true, musOn = true, noiseBuf = null, lastShootSfx = 0;
/* 音乐回声总线：主旋律经 DelayNode 获得空间感 */
var leadGain = null, delayNode = null, delayFb = null, delayWet = null;
function ensureAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = soundOn ? sfxVolG() : 0;
      master.connect(AC.destination);
      musicGain = AC.createGain();
      musicGain.gain.value = musOn ? musVolG() : 0;
      musicGain.connect(AC.destination);
      /* 回声链路：lead -> delay -> feedback 循环 -> 湿声混入 musicGain */
      leadGain = AC.createGain();
      leadGain.gain.value = 1;
      delayNode = AC.createDelay(1.0);
      delayNode.delayTime.value = 0.29;
      delayFb = AC.createGain();
      delayFb.gain.value = 0.34;
      delayWet = AC.createGain();
      delayWet.gain.value = 0.5;
      leadGain.connect(musicGain);
      leadGain.connect(delayNode);
      delayNode.connect(delayFb);
      delayFb.connect(delayNode);
      delayNode.connect(delayWet);
      delayWet.connect(musicGain);
      musStart();
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol) {
  if (!AC || !soundOn) return;
  var t = AC.currentTime;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur, vol, fc) {
  if (!AC || !soundOn) return;
  noiseAt(AC.currentTime, dur, vol, fc, 'lowpass', master);
}
function noiseAt(t, dur, vol, fc, ftype, dest) {
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.8, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  var s = AC.createBufferSource(); s.buffer = noiseBuf;
  var f = AC.createBiquadFilter(); f.type = ftype; f.frequency.value = fc;
  var g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(t); s.stop(t + dur + 0.03);
}
function sfxShoot() {
  var n = performance.now();
  if (n - lastShootSfx < 85) return;
  lastShootSfx = n;
  tone(760, 320, 0.06, 'square', 0.06);
}
function sfxMissile() {
  var n = performance.now();
  if (n - lastShootSfx < 120) return;
  lastShootSfx = n;
  tone(280, 520, 0.09, 'triangle', 0.08);
}
function sfxBoom(big) {
  noiseBurst(big ? 0.75 : 0.28, big ? 0.9 : 0.45, big ? 420 : 750);
  if (big) tone(160, 40, 0.5, 'sawtooth', 0.22);
}
function sfxItem() { tone(520, 820, 0.12, 'sine', 0.25); }
function sfxHit() { tone(300, 55, 0.42, 'sawtooth', 0.4); noiseBurst(0.5, 0.7, 500); }
/* 炸弹音效：低频 sub + 厚噪声 + 三角波垫底，更厚重 */
function sfxBomb() {
  noiseBurst(1.1, 1.0, 240);
  tone(70, 22, 0.9, 'sine', 0.6);
  tone(52, 18, 0.85, 'triangle', 0.42);
  noiseBurst(0.5, 0.5, 1200);
}
function sfxWarn() { tone(220, 220, 0.16, 'square', 0.25); tone(160, 160, 0.16, 'square', 0.25); }
/* Boss 警报：三连脉冲，音高与音量逐次从低到高渐强 */
function sfxAlarmRise() {
  if (!AC || !soundOn) return;
  var t0 = AC.currentTime;
  for (var i = 0; i < 3; i++) {
    var t = t0 + i * 0.75;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(150 + i * 70, t);
    o.frequency.exponentialRampToValueAtTime(500 + i * 190, t + 0.58);
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.14 + i * 0.06, t + 0.09);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.68);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.72);
  }
}
/* 散射炮开火：短促噪声爆发（与火神炮激光音区分） */
function sfxScatter() {
  var n = performance.now();
  if (n - lastShootSfx < 95) return;
  lastShootSfx = n;
  noiseBurst(0.07, 0.15, 1500);
  tone(240, 130, 0.05, 'square', 0.05);
}
/* 护盾兵破盾：碎裂爆闪音 */
function sfxShieldBreak() {
  noiseBurst(0.35, 0.5, 2100);
  tone(1250, 180, 0.32, 'sawtooth', 0.18);
}
function sfxPhase() { tone(440, 880, 0.2, 'square', 0.2); noiseBurst(0.3, 0.4, 900); }
/* Boss 出场 riser：锯齿波频率上扬 + 高通噪声抬升 */
function sfxRiser() {
  if (!AC || !soundOn) return;
  var t = AC.currentTime;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(80, t);
  o.frequency.exponentialRampToValueAtTime(1250, t + 1.1);
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(0.2, t + 1.0);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.28);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 1.32);
  var o2 = AC.createOscillator(), g2 = AC.createGain();
  o2.type = 'square';
  o2.frequency.setValueAtTime(40, t);
  o2.frequency.exponentialRampToValueAtTime(620, t + 1.1);
  g2.gain.setValueAtTime(0.001, t);
  g2.gain.exponentialRampToValueAtTime(0.12, t + 1.0);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 1.28);
  o2.connect(g2); g2.connect(master);
  o2.start(t); o2.stop(t + 1.32);
  noiseAt(t + 0.15, 1.0, 0.14, 2400, 'highpass', master);
}
/* 连击音：音调随连击数递增 */
function sfxCombo(n) {
  var steps = Math.min(n, 16);
  var f = 420 * Math.pow(2, steps / 12);
  tone(f, f * 1.5, 0.09, 'square', 0.11);
  tone(f * 0.5, f * 0.75, 0.07, 'triangle', 0.07);
}
/* 合体进入音：上行琶音 + 闪光噪声 */
function sfxFusion() {
  if (!AC || !soundOn) return;
  var t0 = AC.currentTime;
  var notes = [57, 60, 64, 69, 72, 76];
  for (var i = 0; i < notes.length; i++) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sawtooth';
    o.frequency.value = 440 * Math.pow(2, (notes[i] - 69) / 12);
    var t = t0 + i * 0.055;
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.36);
  }
  noiseAt(t0, 0.4, 0.16, 5200, 'highpass', master);
}
/* 护盾格挡音效节流：甩鞭每帧命中护盾正面时会反复触发本音效，
   不节流每秒叠加约 60 个振荡器，形成连续刺耳杂音；节流到 150ms 并降低音量 */
var lastShieldBlockSfx = 0;
function sfxShieldBlock() {
  var n = performance.now();
  if (n - lastShieldBlockSfx < 150) return;
  lastShieldBlockSfx = n;
  tone(1350, 900, 0.05, 'square', 0.05);
}
function sfxSnipe() { tone(1500, 180, 0.2, 'sawtooth', 0.16); noiseBurst(0.12, 0.2, 2600); }
function sfxMineDrop() { tone(340, 260, 0.08, 'sine', 0.1); }
function sfxContinue() {
  if (!AC || !soundOn) return;
  var t0 = AC.currentTime;
  var notes = [60, 64, 67, 72];
  for (var i = 0; i < notes.length; i++) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (notes[i] - 69) / 12);
    var t = t0 + i * 0.09;
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.34);
  }
}
function sfxFanfare() {
  if (!AC || !soundOn) return;
  var t0 = AC.currentTime;
  var notes = [69, 72, 76, 81, 79, 81];
  for (var i = 0; i < notes.length; i++) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square';
    o.frequency.value = 440 * Math.pow(2, (notes[i] - 69) / 12);
    var t = t0 + i * 0.14;
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (i === notes.length - 1 ? 0.6 : 0.14));
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.7);
  }
}

/* ---------------- music engine ---------------- */
function m2f(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function mTone(midi, dur, type, vol, t) {
  if (!AC) return;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.value = m2f(midi);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + dur + 0.03);
}
/* 主旋律专用：接入带回声的总线 */
function mLead(midi, dur, type, vol, t) {
  if (!AC) return;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.value = m2f(midi);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(leadGain || musicGain);
  o.start(t); o.stop(t + dur + 0.03);
}
function mSweep(f0, f1, dur, type, vol, t) {
  if (!AC) return;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + dur + 0.03);
}
/* 每关独立音乐参数：bpm / 和弦根音 / 调式 / perc 打击乐比重 / bass 低音比重 /
   arp 琶音模式 / leadVol 主旋律音量；boss1~4 为各关 Boss 战变体 */
var MUS = {
  title: { bpm: 96,  roots: [45, 41, 43, 40], minor: [1, 0, 0, 1] },
  /* 第 1 关「深空巡航」：沿用原基调 */
  st1:   { bpm: 138, roots: [45, 41, 43, 40], minor: [1, 0, 0, 1] },
  /* 第 2 关「熔岩带」：BPM +15%，弗里几亚色彩更紧张，打击乐比重加大 */
  st2:   { bpm: 159, roots: [45, 44, 48, 43], minor: [1, 1, 1, 1], perc: 1.5, bass: 1.15 },
  /* 第 3 关「翡翠遗迹」：BPM 放缓，琶音比重加大（回声参数见 STAGES.echo，更深） */
  st3:   { bpm: 112, roots: [40, 36, 41, 38], minor: [1, 1, 0, 1], arp: true, leadVol: 0.08 },
  /* 第 4 关「虚空核心」：全编制最快最压迫，低音线条加重 */
  st4:   { bpm: 168, roots: [41, 40, 44, 38], minor: [1, 1, 1, 1], perc: 1.25, bass: 1.35 },
  boss1: { bpm: 154, roots: [45, 44, 45, 41], minor: [1, 1, 1, 0] },
  boss2: { bpm: 162, roots: [45, 44, 47, 41], minor: [1, 1, 1, 1], perc: 1.3 },
  boss3: { bpm: 148, roots: [40, 39, 43, 38], minor: [1, 1, 1, 1], bass: 1.15 },
  boss4: { bpm: 176, roots: [41, 40, 44, 38], minor: [1, 1, 1, 1], perc: 1.3, bass: 1.3 }
};
MUS.main = MUS.st1; MUS.boss = MUS.boss1; /* 兼容别名 */
var LEAD = [
  [{ s: 0, m: 69, d: 2 }, { s: 2, m: 72, d: 2 }, { s: 4, m: 74, d: 2 }, { s: 6, m: 76, d: 3 }, { s: 10, m: 74, d: 2 }, { s: 12, m: 72, d: 4 }],
  [{ s: 0, m: 77, d: 2 }, { s: 2, m: 76, d: 2 }, { s: 4, m: 74, d: 2 }, { s: 6, m: 72, d: 3 }, { s: 10, m: 74, d: 2 }, { s: 12, m: 69, d: 4 }],
  [{ s: 0, m: 74, d: 2 }, { s: 2, m: 76, d: 2 }, { s: 4, m: 79, d: 2 }, { s: 6, m: 81, d: 3 }, { s: 10, m: 79, d: 2 }, { s: 12, m: 76, d: 4 }],
  [{ s: 0, m: 76, d: 4 }, { s: 4, m: 74, d: 2 }, { s: 6, m: 72, d: 2 }, { s: 8, m: 71, d: 2 }, { s: 10, m: 72, d: 2 }, { s: 12, m: 74, d: 6 }]
];
var musTimer = null, musStep = 0, musNext = 0, musTrack = 'title';
function musStart() {
  if (musTimer || !AC) return;
  musNext = AC.currentTime + 0.12;
  musStep = 0;
  musTimer = setInterval(musSched, 25);
}
function musSched() {
  if (!AC) return;
  var tr = MUS[musTrack] || MUS.main;
  var step16 = 60 / tr.bpm / 4;
  var guard = 0;
  while (musNext < AC.currentTime + 0.16 && guard++ < 32) {
    scheduleStep(musStep, musNext, step16);
    musStep = (musStep + 1) % 64;
    musNext += step16;
  }
}
function scheduleStep(step, t, step16) {
  var tr = MUS[musTrack] || MUS.st1;
  var bar = (step >> 4) & 3, s = step & 15;
  var root = tr.roots[bar], isMinor = tr.minor[bar];
  var perc = tr.perc || 1, bass = tr.bass || 1; /* 打击乐 / 低音比重（关卡参数） */
  if (musTrack === 'title') {
    var tones = [0, isMinor ? 3 : 4, 7, 12];
    mTone(root + 24 + tones[s % 4], 0.18, 'triangle', 0.10, t);
    if (s === 0) mTone(root + 12, 1.7, 'sine', 0.06, t);
    if (s % 4 === 2) noiseAt(t, 0.03, 0.04, 7000, 'highpass', musicGain);
    return;
  }
  if (s % 4 === 0) mSweep(135, 42, 0.13, 'sine', 0.5 * bass, t);

    else if (k === 'ArrowLeft' || k === 'ArrowRight') settingsAdjust(k === 'ArrowRight' ? 1 : -1);

    return;
  }

       Enter/Escape 屏蔽长按连发，避免按住回车瞬间跳过留名并连锁触发下一界面的确认键 */
    if (e.repeat && (k === 'Enter' || k === 'Escape')) return;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { neLetters[nePos] = (neLetters[nePos] + 1) % 26; sfxItem(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { neLetters[nePos] = (neLetters[nePos] + 25) % 26; sfxItem(); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') nePos = Math.max(0, nePos - 1);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') nePos = Math.min(2, nePos + 1);
    else if (k === 'Enter') { if (nePos < 2) { nePos++; sfxItem(); } else finishNameEntry(); }
    else if (k === 'Escape') finishNameEntry();

    return;

  if (mode === 'victory') {
    if (e.repeat) return; /* 屏蔽连发：防止按住 Enter/C 连锁触发下一界面操作 */
    if (k === 'Enter') { setMode('title'); stage = 1; stageWave = 1; endlessLoop = 0; }
    if (k === 'c' || k === 'C') { victoryEndless(); }
    return;
  }
  if (mode === 'gameover') {
    if (e.repeat) return; /* 同上：留名确认后按住回车不会立刻重开 */
    if (k === 'Enter') { ensureAudio(); startGame(numPlayers); }
    if (k === 'c' || k === 'C') { ensureAudio(); continueGame(); }
    return;
  }
  if (mode === 'paused') {
    if (k === 'ArrowUp' || k === 'ArrowDown') pauseIdx = (pauseIdx + 1) % 2;
    else if (k === 'Enter') { if (pauseIdx === 0) togglePause(); else backToTitle(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') togglePause();
    return;
  }
  if ((k === 'p' || k === 'P' || k === 'Escape') && mode === 'playing') togglePause();
  if (mode === 'playing') {
    if (k === 'x' || k === 'X' || k === 'b' || k === 'B' || k === ' ' || k === 'q' || k === 'Q') useBomb(players[0]);

             blast(50) 内，而命中半径是 e.r+10——大体积 Boss（r=52，命中半径 62）
             会在 50~62px 环带引爆导弹却不掉血，导致追踪导弹对 Boss 零伤害 */
          if (e2 === e || ax * ax + ay * ay < blast * blast) damageEnemy(e2, e2 === e ? m.dmg : 4, m.x, m.y);
        }
        hit = true;
        break;
      }
    }
    if (hit) missiles.splice(i, 1);
  }
}

/* --- 电浆鞭（Raiden 风格，每玩家一条）：Verlet 绳物理 ---
   节点存 x,y,px,py；鞭根（0 号）每帧钉在机头，其余节点 verlet 积分（带阻尼）
   + 3 轮距离约束迭代（相邻节点固定节距 segLen）。玩家移动时机头拖拽绳体，
   产生自然的滞后 / 甩尾弧线——这是"鞭子感"的来源。
   导向加速度按 (节点序号/绳长)^3 向鞭梢集中（鞭根几乎不受力），
   绳体逐渐弯成弧线扑向目标而非瞬间拉直；锁定本身不产生任何伤害，
   伤害只发生在鞭梢 / 鞭身与敌人实际接触时。 */
var WHIP_N = 16;
function whipLen(p) { return 210 + 26 * p.lvl; } /* 绳总长 L */
function whipResetAll() {
  for (var i = 0; i < players.length; i++) { players[i].whip.nodes = null; players[i].whip.locked = null; }
}
/* 索敌：只锁定鞭子物理可达的敌人——与玩家距离 ≤ L+40 且横向 |dx| ≤ 150 */
function acquireLock(p) {
  var L = whipLen(p);
  var best = null, bd = 1e12;
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    if (e.dead || e.gone || e.y > H + 20 || e.y < -20) continue;
    var dx = e.x - p.x, dy = e.y - p.y;
    if (Math.abs(dx) > 150) continue;
    var d2 = dx * dx + dy * dy;
    if (d2 > (L + 40) * (L + 40)) continue;
    if (d2 < bd) { bd = d2; best = e; }
  }
  return best;
}
function updateWhip(p, dt) {
  var wp = p.whip;
  var L = whipLen(p);
  var segLen = L / (WHIP_N - 1);
  var ax = p.x, ay = p.y - 16; /* 机头锚点 */
  var i;
  if (!wp.nodes) {
    /* 初始绳：自机头竖直向上展开，当前/上一帧位置一致（静止起步） */
    wp.nodes = [];
    for (i = 0; i < WHIP_N; i++) {
      var iy = ay - segLen * i;
      wp.nodes.push({ x: ax, y: iy, px: ax, py: iy });
    }
  }
  /* 锁定磁滞：已锁目标除非死亡 / 出屏 / 超出 L+70 才脱锁，避免边界抖动切换 */
  if (wp.locked) {
    var lk = wp.locked;
    var ldx = lk.x - p.x, ldy = lk.y - p.y;
    if (lk.dead || lk.gone || lk.y > H + 30 || ldx * ldx + ldy * ldy > (L + 70) * (L + 70)) wp.locked = null;
  }
  if (!wp.locked) wp.locked = acquireLock(p);

  /* 1) verlet 积分：惯性 + 阻尼 + 轻微下坠（给绳一点重量感，闲置时自然摆动） */
  var damp = Math.max(0, 1 - 2.4 * dt);
  var dt2 = dt * dt;
  for (i = 1; i < WHIP_N; i++) {
    var n = wp.nodes[i];
    var vx = (n.x - n.px) * damp;
    var vy = (n.y - n.py) * damp;
    n.px = n.x; n.py = n.y;
    n.x += vx;
    n.y += vy + 20 * dt2;
  }
  /* 2) 导向：转向加速度按 (节点序号/绳长)^3 向鞭梢集中——鞭根几乎不受力、
     保持自由甩动，鞭梢被明显牵引向锁定目标，绳体逐渐弯成弧线而不是被瞬间
     拉直（实测：纯鞭梢单点导向在距离约束下弯折无法沿绳上传，鞭梢会停在
     目标外 ~37px 的平衡点；立方衰减是保持"鞭梢导向"手感的最小扩散）。
     无锁定时鞭梢轻微上探，随玩家移动自然摆动 */
  var tip = wp.nodes[WHIP_N - 1];
  var gx, gy, steer;
  if (wp.locked && !wp.locked.dead) { gx = wp.locked.x; gy = wp.locked.y; steer = 2400; }
  else { gx = p.x; gy = ay - L * 0.8; steer = 670; }
  for (i = 1; i < WHIP_N; i++) {
    var wf = Math.pow(i / (WHIP_N - 1), 3);
    if (wf < 0.02) continue;
    var wn = wp.nodes[i];
    var sdx = gx - wn.x, sdy = gy - wn.y;
    var sd = Math.sqrt(sdx * sdx + sdy * sdy);
    if (sd > 1) {
      var acc = Math.min(steer * wf, sd * 6); /* 接近目标时收力，防止绕目标振荡 */
      wn.x += sdx / sd * acc * dt2;
      wn.y += sdy / sd * acc * dt2;
    }
  }
  /* 3) 距离约束迭代（3 轮）：相邻节点保持 segLen 节距；鞭根每轮重新钉回机头，
     且父节视为已定位、修正量全给子节——从鞭根向鞭梢单轮即可把绳长收敛，
     玩家高速移动时绳体被拖拽出甩尾弧线但不会被拉长/压缩 */
  var n0 = wp.nodes[0];
  for (var iter = 0; iter < 3; iter++) {
    n0.x = ax; n0.y = ay;
    for (i = 0; i < WHIP_N - 1; i++) {
      var na = wp.nodes[i], nb = wp.nodes[i + 1];
      var ddx = nb.x - na.x, ddy = nb.y - na.y;
      var dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1e-6;
      var corr = (dd - segLen) / dd;
      nb.x -= ddx * corr; nb.y -= ddy * corr;
    }
  }
  n0.x = ax; n0.y = ay; n0.px = ax; n0.py = ay; /* 钉死鞭根并清零其速度，杜绝漂移 */

  /* 4) 纯接触伤害：锁定只负责引导鞭梢，不再隔空掉血。
     鞭梢接触全 dps，鞭身擦碰 0.35 倍；伤害源取实际接触节点位置，
     鞭身绕到护盾兵侧后方时可正确打出双倍伤害 */
  var dps = (26 + 24 * p.lvl) * dmgMul();
  for (var j = 0; j < enemies.length; j++) {
    var e = enemies[j];
    if (e.dead || e.y > H + 20 || e.y < -40) continue;
    var tdx = e.x - tip.x, tdy = e.y - tip.y, trr = e.r + 6 + p.lvl;
    if (tdx * tdx + tdy * tdy < trr * trr) {
      damageEnemy(e, dps * dt, tip.x, tip.y);
      if (Math.random() < dt * 26) spark(tip.x + rand(-4, 4), tip.y + rand(-4, 4));
      continue; /* 同一敌人同帧只吃一段伤害 */
    }
    for (i = 1; i < WHIP_N - 1; i++) {
      var nn = wp.nodes[i];
      var bdx = e.x - nn.x, bdy = e.y - nn.y, brr = e.r + 4 + p.lvl;
      if (bdx * bdx + bdy * bdy < brr * brr) {
        damageEnemy(e, dps * 0.35 * dt, nn.x, nn.y);
        if (Math.random() < dt * 10) spark(nn.x, nn.y);
        break;
      }
    }
  }
}
function drawWhip(p) {
  var wp = p.whip;
  if (p.weapon !== 'blue' || !p.alive || mode !== 'playing' || !wp.nodes) return;
  var tt = performance.now() / 46;
  var wCore = 2 + p.lvl * 1.1;
  var wGlow = wCore + 4 + p.lvl * 2;
  var tint = p.id === 0 ? '150,90,255' : '255,120,200';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  function pathThrough(offset) {
    ctx.beginPath();
    /* 修复：绘制路径也从机头锚点起笔，与硬钉的物理鞭根保持一致 */
    ctx.moveTo(p.x, p.y - 16);
    for (var i = 1; i < WHIP_N; i++) {
      var n = wp.nodes[i];
      var off = Math.sin(tt + i * 1.7) * (1.2 + p.lvl * 0.5) * (i / WHIP_N) * offset;
      ctx.lineTo(n.x + off, n.y);
    }
  }
  ctx.strokeStyle = 'rgba(' + tint + ',0.4)';
  ctx.lineWidth = wGlow;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  pathThrough(1);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(' + tint + ',0.7)';
  ctx.lineWidth = wCore + 2;
  pathThrough(-1);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(245,240,255,0.95)';
  ctx.lineWidth = wCore;
  pathThrough(0);
  ctx.stroke();
  /* 鞭梢能量亮点：随速度增亮，强调实际接触点 */
  var tipN = wp.nodes[WHIP_N - 1];
  var tipSpd = Math.sqrt((tipN.x - tipN.px) * (tipN.x - tipN.px) + (tipN.y - tipN.py) * (tipN.y - tipN.py)) * 60;
  var tipR = 6 + p.lvl + Math.min(5, tipSpd * 0.006);
  var tg = ctx.createRadialGradient(tipN.x, tipN.y, 0.5, tipN.x, tipN.y, tipR);
  tg.addColorStop(0, 'rgba(255,255,255,0.95)');
  tg.addColorStop(0.4, 'rgba(' + tint + ',0.75)');
  tg.addColorStop(1, 'rgba(' + tint + ',0)');
  ctx.fillStyle = tg;
  ctx.beginPath(); ctx.arc(tipN.x, tipN.y, tipR, 0, TAU); ctx.fill();
  if (tipSpd > 320 && Math.random() < 0.35) spark(tipN.x, tipN.y); /* 高速甩动时鞭梢溅火花 */
  if (wp.locked && !wp.locked.dead) {
    ctx.strokeStyle = 'rgba(' + tint + ',0.85)';
    ctx.lineWidth = 1.6;
    var lr = wp.locked.r + 5 + Math.sin(tt * 2) * 2.5;
    ctx.beginPath();
    ctx.arc(wp.locked.x, wp.locked.y, lr, tt % TAU, tt % TAU + TAU * 0.7);
    ctx.stroke();
  }
  ctx.restore();
}

/* 电浆鞭持续嗡嗡声：每名玩家一条长寿命 oscillator+gain（最多 2 条），
   仅在 武器=blue 且 mode==='playing' 且玩家存活 时发声，否则淡出并 stop，
   替代高频重复触发音效，避免每帧创建振荡器叠加成刺耳杂音或泄漏累积 */
var whipHum = [null, null];
function whipHumUpdate() {
  if (!AC) return;
  var i, p, want, hum;
  for (i = 0; i < 2; i++) {
    p = players[i];
    want = !!(p && soundOn && mode === 'playing' && p.alive && p.weapon === 'blue');
    hum = whipHum[i];
    if (want && !hum) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sawtooth';
      o.frequency.value = 78 + i * 9;
      g.gain.value = 0;
      g.gain.setTargetAtTime(0.03, AC.currentTime, 0.09); /* 淡入防止爆音 */
      o.connect(g); g.connect(master);
      o.start();
      whipHum[i] = { o: o, g: g };
    } else if (!want && hum) {
      try {
        hum.g.gain.setTargetAtTime(0, AC.currentTime, 0.04); /* 淡出 */
        hum.o.stop(AC.currentTime + 0.2);                    /* 确保 stop，osc 不泄漏累积 */
      } catch (e) {}
      whipHum[i] = null;
    }
  }
  /* 轻微音高抖动模拟电弧质感；鞭梢高速运动时音调微升（甩鞭脆响感） */
  for (i = 0; i < 2; i++) {
    if (whipHum[i]) {
      var hp2 = players[i];
      var lift = 0;
      if (hp2 && hp2.whip.nodes) {
        var ht = hp2.whip.nodes[WHIP_N - 1];
        var hdx = ht.x - ht.px, hdy = ht.y - ht.py;
        lift = Math.min(52, Math.sqrt(hdx * hdx + hdy * hdy) * 11);
      }
      whipHum[i].o.frequency.value = 78 + i * 9 + Math.sin(gameT * 21 + i * 2.3) * 5 + lift;
    }
  }
}

/* 爆炸：彩色碎屑 + 多环冲击波 */
function explode(x, y, n, big) {
  var cols = ['#ffd76a', '#ff9040', '#ff5040', '#fff2c0', '#8ad0ff', '#ff8ad0'];
  var count = reduceMotion ? Math.ceil(n / 2) : n;
  for (var i = 0; i < count; i++) {
    var a = rand(0, TAU), sp = rand(40, big ? 280 : 180);
    parts.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, big ? 0.95 : 0.6), max: 0.95, size: rand(1.5, big ? 4.4 : 3),
      c: cols[(Math.random() * cols.length) | 0],
      rot: rand(0, TAU), spin: rand(-9, 9), debris: true
    });
  }
  /* 多环冲击波：快环 + 慢环，Boss/大型目标再加一环 */
  parts.push({ x: x, y: y, ring: true, life: 0.32, max: 0.32, r: 6, vr: big ? 520 : 260, cc: '255,220,150' });
  parts.push({ x: x, y: y, ring: true, life: 0.48, max: 0.48, r: 4, vr: big ? 330 : 160, cc: '150,200,255' });
  if (big) parts.push({ x: x, y: y, ring: true, life: 0.66, max: 0.66, r: 3, vr: 200, cc: '255,140,200' });
}
function spark(x, y) {
  parts.push({ x: x, y: y, vx: rand(-30, 30), vy: rand(-60, -10), life: 0.18, max: 0.18, size: 1.6, c: '#ffe9a0' });
}
/* hx/hy 为伤害来源位置：护盾兵正面（下方 120°）由护盾 HP 吸收，侧后方双倍伤害 */
function damageEnemy(e, d, hx, hy) {
  if (e.dead) return;
  /* 防御：伤害值不是有限正数（NaN / Infinity / 0 / 负数）时直接忽略，
     避免非法伤害把敌方 hp 污染成 NaN 导致永远无法击坠 */
  if (!(d > 0) || !isFinite(d)) return;
  if (e.type === 'shielder' && hx !== undefined) {
    var ang = Math.atan2(hy - e.y, hx - e.x);
    var dd = ((ang - Math.PI / 2 + Math.PI * 3) % TAU) - Math.PI;
    var frontal = Math.abs(dd) < Math.PI / 3; /* 正面 120° */
    if (frontal && e.shieldDownT <= 0) {
      /* 正面攻击磨盾：任意武器都可削减护盾 HP，归零触发碎裂 + 硬直 + 脆弱期 */
      e.shieldHp -= d;
      e.hitT = 0.05;
      if (Math.random() < 0.6) spark(clamp(hx, e.x - e.r, e.x + e.r), clamp(hy, e.y - e.r, e.y + e.r));
      sfxShieldBlock();
      if (e.shieldHp <= 0) shieldBreak(e);
      return;
    }
    if (!frontal) d *= 2; /* 侧后方（含电浆鞭绕侧、导弹绕后）双倍伤害 */
  }
  e.hp -= d;
  e.hitT = 0.08;
  if (e.hp <= 0) { e.dead = true; killEnemy(e); }
}
/* 护盾兵破盾：碎裂爆闪 + 硬直 0.5s + 4s 无盾脆弱期（之后护盾恢复满） */
function shieldBreak(e) {
  e.shieldHp = 0;
  e.shieldDownT = 4;
  e.stunT = 0.5;
  explode(e.x, e.y + e.r * 0.5, 16, false);
  for (var i = 0; i < 14; i++) {
    var a = rand(0, TAU), sp = rand(70, 240);
    parts.push({
      x: e.x, y: e.y + 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.7), max: 0.7, size: rand(1.5, 3),
      c: '#7ae0ff', rot: rand(0, TAU), spin: rand(-9, 9), debris: true
    });
  }
  flash = Math.max(flash, 0.18);
  shakeT = Math.max(shakeT, 0.25);
  sfxShieldBreak();
  floats.push({ x: e.x, y: e.y - e.r - 8, text: '护盾破碎！', t: 0.9 });
}
function killEnemy(e) {
  score += e.score;
  kills++;
  if (score > hi) hi = score;
  /* 连击：短时间连续击坠 -> 飘字 + 音调递增 */
  if (comboT > 0) comboCount++; else comboCount = 1;
  comboT = 1.5;
  floats.push({ x: e.x, y: e.y, text: '+' + e.score, t: 1 });
  if (comboCount >= 3) {
    floats.push({ x: e.x, y: e.y - 16, text: 'COMBO x' + comboCount, t: 1.1, combo: true });
    sfxCombo(comboCount);
  }
  var big = e.type === 'boss' || e.type === 'gunboat';
  explode(e.x, e.y, e.type === 'boss' ? 70 : big ? 30 : 14, e.type === 'boss');
  sfxBoom(e.type === 'boss' || big);
  /* 精英/大型敌人约 15% 掉限时导弹 H（另有每 8 波保底） */
  var elite = e.type === 'gunboat' || e.type === 'sniper' || e.type === 'shielder' || e.type === 'minelayer';
  if (elite && Math.random() < 0.15) dropKind(e.x, e.y, 'H');
  /* 稀有掉落：临时护盾 / 炸弹碎片，各约 2.5%，仅击毁敌人时掉落 */
  if (e.type !== 'boss') {
    var rr = Math.random();
    if (rr < 0.025) dropKind(e.x + rand(-10, 10), e.y, 'D');
    else if (rr < 0.05) dropKind(e.x + rand(-10, 10), e.y, 'F');
  }
  if (e.type === 'carrier') dropItem(e.x, e.y);
  else if (e.type === 'gunboat' && Math.random() < 0.35) dropMedal(e.x, e.y);
  else if (e.type === 'boss') bossDown(e);
}
function bossDown(e) {
  for (var i = 0; i < ebullets.length; i++) explode(ebullets[i].x, ebullets[i].y, 3);
  ebullets.length = 0;
  for (var m = 0; m < mines.length; m++) explode(mines[m].x, mines[m].y, 6);
  mines.length = 0;
  score += 2000;
  if (score > hi) hi = score;
  floats.push({ x: W / 2, y: H / 2 - 40, text: 'WAVE BONUS +2000', t: 2 });
  waveBanner('WAVE CLEAR');
  shakeT = Math.max(shakeT, 0.7);
  stageClearPending = true; /* 关底 Boss 击破：非最终关 -> 关间过场，最终关 -> 通关结算 */
}
function dropKind(x, y, kind) { items.push({ x: clamp(x, 20, W - 20), y: y, vy: 58, kind: kind, t: 0 }); }
/* 运输船道具池：三种常驻武器 V/L/S（红/蓝/金）权重大致相等；
   H 不再走常驻池，改由精英敌人 15% 概率与每 8 波保底掉落 */
function dropItem(x, y) {
  var r = Math.random(), kind;
  if (r < 0.18) kind = 'P';
  else if (r < 0.34) kind = 'V';
  else if (r < 0.50) kind = 'L';
  else if (r < 0.66) kind = 'S';
  else if (r < 0.80) kind = 'B';
  else kind = 'M';
  dropKind(x, y, kind);
}
function dropMedal(x, y) { dropKind(x, y, 'M'); }
function collectItem(p, it) {
  sfxItem();
  var fx = p.x, fy = p.y - 26;
  if (it.kind === 'P') {
    if (p.lvl < 5) { p.lvl++; floats.push({ x: fx, y: fy, text: 'POWER UP!', t: 1.2 }); }
    else { score += 1000; floats.push({ x: fx, y: fy, text: '+1000', t: 1 }); }
  } else if (it.kind === 'V' || it.kind === 'L' || it.kind === 'S') {
    /* 常驻武器：切换或升级，战机头顶弹出「武器名 LVx！」浮动文字 */
    var wKey = it.kind === 'V' ? 'red' : it.kind === 'L' ? 'blue' : 'spr';
    if (p.weapon === wKey) {
      if (p.lvl < 5) { p.lvl++; floats.push({ x: fx, y: fy, text: WEAPON_NAMES[wKey] + ' LV' + p.lvl + '！', t: 1.2 }); }
      else { score += 1000; floats.push({ x: fx, y: fy, text: '+1000', t: 1 }); }
    } else {
      p.weapon = wKey;
      if (wKey === 'blue') { p.whip.nodes = null; p.whip.locked = null; }
      floats.push({ x: fx, y: fy, text: WEAPON_NAMES[wKey] + ' LV' + p.lvl + '！', t: 1.2 });
    }
  } else if (it.kind === 'H') {
    /* 限时追踪导弹副火力：+18s，生效期间再捡续时，上限 30s，不替换主武器 */
    p.homT = Math.min(30, p.homT + 18);
    floats.push({ x: fx, y: fy, text: '追踪导弹 +18s', t: 1.2 });
  } else if (it.kind === 'D') {
    /* 临时护盾：5 秒抵挡所有伤害 */
    p.shieldT = 5;
    floats.push({ x: fx, y: fy, text: '临时护盾 5s！', t: 1.2 });
  } else if (it.kind === 'F') {
    /* 炸弹碎片：集齐 3 个自动兑换 +1 炸弹 */
    p.frags++;
    if (p.frags >= 3) {
      p.frags = 0;
      p.bombs = Math.min(6, p.bombs + 1);
      floats.push({ x: fx, y: fy, text: '碎片集齐 炸弹 +1！', t: 1.2 });
    } else {
      floats.push({ x: fx, y: fy, text: '炸弹碎片 ' + p.frags + '/3', t: 1.2 });
    }
  } else if (it.kind === 'B') {
    p.bombs = Math.min(6, p.bombs + 1);

    score += 500;

}
function playerHit(p) {
  if (godMode || p.inv > 0 || !p.alive) return; /* godMode：调试/录制钩子 ?god=1 */

    /* 临时护盾：抵挡所有伤害，仅溅出火花 */

  }
  explode(p.x, p.y, 44, true);

    p.alive = false;

    if (!anyAlive) {

/* 续命：全员满 3 命原地复活 + 无敌 3 秒，分数保留 */
function continueGame() {

}
/* 炸弹重做：全屏白闪 + 慢动作 + 3 圈冲击波 + 放射光束 + 新星粒子 */
function useBomb(p) {

  parts.push({ x: bx, y: by, ring: true, life: 0.68, max: 0.68, r: 8, vr: 520, cc: '150,210,255' });
  parts.push({ x: bx, y: by, ring: true, life: 0.85, max: 0.85, r: 5, vr: 340, cc: '255,190,120' });
  /* 大量新星粒子 */

    parts.push({

/* ---------------- boss AI: 3 kinds x 3 phases ---------------- */
function updateBoss(e, dt) {
  var enterY = e.kind === 1 ? 168 : e.kind === 2 ? 96 : 112;
  if (e.y < enterY) {
    e.y += 46 * dt;
    /* 登场剪影：巨大黑影从屏幕上方压入，0.6s 后爆闪点亮 */
    if (e.silT === undefined && e.y + e.r > 0) e.silT = 0.6;
    if (e.silT > 0) {
      e.silT -= dt;
      if (e.silT <= 0) {
        flash = Math.max(flash, 0.3);
        explode(e.x, Math.max(24, e.y), 16, false);
        sfxPhase();
      }
    }
    return;
  }
  /* 修复横向跳变：游走相位改用独立计时器 e.mt（入场结束后才从 0 累加），
     原实现直接用全程累加的 e.t，切换瞬间 sin 相位任意导致 x 瞬移 */
  e.mt += dt;
  e.rot += dt;
  if (e.kind === 0) e.x = W / 2 + Math.sin(e.mt * 0.55) * 130;
  else if (e.kind === 1) e.x = W / 2 + Math.sin(e.mt * 0.85) * 168;
  else e.x = W / 2 + Math.sin(e.mt * 0.34) * 92;
  var frac = e.hp / e.maxhp;
  var np = frac > 0.6 ? 1 : frac > 0.3 ? 2 : 3;
  if (np !== e.phase) {
    e.phase = np;
    waveBanner('PHASE ' + np);
    sfxPhase();
    explode(e.x, e.y, 22, true);
    for (var i = 0; i < ebullets.length; i++) explode(ebullets[i].x, ebullets[i].y, 2);
    ebullets.length = 0;
    for (var m = 0; m < mines.length; m++) explode(mines[m].x, mines[m].y, 5);
    mines.length = 0;
    shakeT = Math.max(shakeT, 0.4);
  }
  var spdMul = 1 + 0.16 * (e.phase - 1);
  var intMul = [1, 0.85, 0.68][e.phase - 1];
  e.patT += dt;
  if (e.patT > 3.2) { e.pat = (e.pat + 1) % (e.variant ? 4 : 3); e.patT = 0; }
  e.fireT -= dt;
  if (e.fireT > 0) return;
  var tgt = nearestPlayer(e.x, e.y);
  var a0 = Math.atan2(tgt.y - e.y, tgt.x - e.x);
  var k, s;
  var bc = e.bulletC; /* 关卡主题弹色（STAGES.bulletC，第 1 关为 null 用默认色） */
  if (e.kind === 0) {
    if (e.pat === 0) {
      var nSpread = 3 + e.phase * 2;
      for (k = 0; k < nSpread; k++) eShoot(e.x, e.y + 24, a0 + (k - (nSpread - 1) / 2) * 0.14, 168 * df() * spdMul, 0, 'std', bc);
      e.fireT = 0.55 * intMul;
    } else if (e.pat === 1) {
      var nRing = 10 + e.phase * 3;
      for (k = 0; k < nRing; k++) eShoot(e.x, e.y, e.rot + k * (TAU / nRing), 122 * df() * spdMul, 0, 'std', bc);
      e.fireT = 0.85 * intMul;
    } else {
      eShoot(e.x - 20, e.y + 18, a0, 215 * df() * spdMul, 0, 'lance', bc);
      eShoot(e.x + 20, e.y + 18, a0, 215 * df() * spdMul, 0, 'lance', bc);
      e.fireT = 0.3 * intMul;
    }
  } else if (e.kind === 1) {
    if (e.pat === 0) {
      var nFan = 2 + e.phase;
      for (s = -1; s <= 1; s += 2) {
        var base = Math.atan2(tgt.y - e.y, tgt.x - e.x + s * 30);
        for (k = 0; k < nFan; k++) eShoot(e.x + s * 30, e.y + 12, base + (k - (nFan - 1) / 2) * 0.22, 162 * df() * spdMul, 0, 'std', bc);
      }
      e.fireT = 0.8 * intMul;
    } else if (e.pat === 1) {
      var arms = e.phase >= 3 ? 4 : 3;
      for (k = 0; k < arms; k++) eShoot(e.x, e.y, e.rot * 2.2 + k * (TAU / arms), 128 * df() * spdMul, 0, 'std', bc);
      e.fireT = 0.16 * intMul;
    } else {
      var escorts = 0;
      for (k = 0; k < enemies.length; k++) if (enemies[k].type === 'fighter') escorts++;
      if (escorts < 4) {
        spawnFighter(clamp(e.x - 34, 16, W - 16), e.y + 30, { vy: 150 });
        spawnFighter(clamp(e.x + 34, 16, W - 16), e.y + 30, { vy: 150 });
      }
      for (s = -1; s <= 1; s++) eShoot(e.x, e.y + 16, a0 + s * 0.15, 185 * df() * spdMul, 0, 'std', bc);
      e.fireT = 2.1 * intMul;
    }
  } else {
    if (e.pat === 0) {
      var gapX = clamp(tgt.x + rand(-50, 50), 60, W - 60);
      for (k = -4; k <= 4; k++) {
        var bx = e.x + k * 32;
        if (Math.abs(bx - gapX) < 52) continue;
        ebullets.push({ x: bx, y: e.y + 34, vx: 0, vy: 152 * df() * spdMul, r: 4, t: 0, homing: 0, kind: 'std', c: bc });
      }
      e.fireT = 1.6 * intMul;
    } else if (e.pat === 1) {
      var arms2 = 2 + (e.phase >= 3 ? 1 : 0) + (e.variant ? 1 : 0); /* 虚空核心弹幕密度提升 */
      for (k = 0; k < arms2; k++) {
        eShoot(e.x, e.y, e.rot * 2.6 + k * (TAU / arms2), 132 * df() * spdMul, 0, 'std', bc);
        eShoot(e.x, e.y, -e.rot * 2.6 + k * (TAU / arms2), 132 * df() * spdMul, 0, 'std', bc);
      }
      e.fireT = 0.15 * intMul;
    } else if (e.pat === 3 && e.variant) {
      /* 虚空核心新攻击模式：旋转交叉激光（4 向 lance 流）+ 间歇三连追踪弹幕 */
      for (k = 0; k < 4; k++) eShoot(e.x, e.y, e.rot * 1.5 + k * Math.PI / 2, 205 * df() * spdMul, 0, 'lance', bc);
      e.xburst = (e.xburst || 0) + 1;
      if (e.xburst % 4 === 0) {
        for (k = -1; k <= 1; k++) eShoot(e.x, e.y + 20, a0 + k * 0.3, 108 * df(), 1.5, 'orb');
      }
      e.fireT = 0.2 * intMul;
    } else {
      eShoot(e.x - 26, e.y + 20, a0, 228 * df() * spdMul, 0, 'lance', bc);
      eShoot(e.x + 26, e.y + 20, a0, 228 * df() * spdMul, 0, 'lance', bc);
      eShoot(e.x, e.y + 26, a0, 100 * df(), 1.35, 'orb');
      e.fireT = 1.15 * intMul;
    }
  }
}

/* ---------------- flow ---------------- */
function setMode(m) {
  mode = m;
  btnStart.textContent = (m === 'title') ? '开始游戏' : '重新开始';
  btnPause.disabled = !(m === 'playing' || m === 'paused');
  btnPause.textContent = m === 'paused' ? '继续' : '暂停';
}
/* n: 玩家人数；fromStage/fromWave: 起始关与起始波（关卡选择 / 调试钩子），缺省第 1 关第 1 波 */
function startGame(n, fromStage, fromWave) {
  numPlayers = n || 1;
  players = [];
  for (var i = 0; i < numPlayers; i++) {
    var p = mkPlayer(i);
    p.x = respawnX(i);
    p.inv = 2;
    p.weapon = startWeapon; /* 练习模式可选初始武器，默认火神炮 */
    players.push(p);
  }
  bullets.length = 0; ebullets.length = 0; enemies.length = 0; items.length = 0; parts.length = 0; floats.length = 0; missiles.length = 0; mines.length = 0;
  score = 0;
  startStage = clamp(fromStage || 1, 1, STAGE_COUNT);
  wave = (startStage - 1) * STAGE_WAVES + clamp(fromWave || 1, 1, STAGE_WAVES);
  interT = 0; flash = 0; shakeT = 0;
  gameT = 0; kills = 0; victoryPending = false; stageClearPending = false;
  continuesLeft = D().cont;
  comboCount = 0; comboT = 0;
  slowmoT = 0; bombBlast = null;
  fusionOn = false; fusionT = 0; fusionFireT = 0;
  banner.text = ''; banner.t = 0;
  setMode('playing');
  startWave(wave);
  cv.focus();
}
function victoryEndless() {
  victoryPending = false;
  setMode('playing');
  wave++;
  startWave(wave); /* 波号越过第 4 关后由 waveInfo 自动循环 4 关主题并递增无尽轮次 */
  cv.focus();
}
/* 关间过场：黑场淡入下一关关卡名，背景音乐交叉淡入新曲目，约 2.5 秒 */
function beginIntermission(next) {
  intermNext = next;
  intermT = 0;
  setMode('intermission');

}
function togglePause() {

  else if (mode === 'paused') { setMode('playing'); cv.focus(); }
}
/* 暂停菜单 -> 返回标题：清场避免残留 */
function backToTitle() {
  enemies.length = 0; bullets.length = 0; ebullets.length = 0;
  missiles.length = 0; mines.length = 0; items.length = 0;
  fusionOn = false; fusionT = 0; slowmoT = 0; bombBlast = null;
  stage = 1; stageWave = 1; endlessLoop = 0; stageClearPending = false;

}

btnPause.addEventListener('click', function () { ensureAudio(); togglePause(); });
btnSound.addEventListener('click', function () {

/* ---------------- update ---------------- */
function playerMoveVector(p) {
  var mx = 0, my = 0;
  if (numPlayers === 1 || p.id === 0) {
    if (keys['a']) mx -= 1;
    if (keys['d']) mx += 1;
    if (keys['w']) my -= 1;
    if (keys['s']) my += 1;
  }
  if (numPlayers === 1 || p.id === 1) {
    if (keys['ArrowLeft']) mx -= 1;
    if (keys['ArrowRight']) mx += 1;
    if (keys['ArrowUp']) my -= 1;
    if (keys['ArrowDown']) my += 1;
  }
  return { x: mx, y: my };
}
/* 合体状态机：双人均活、距离 < 70px 持续 0.6s 进入，> 110px 解除 */
function updateFusion(dt) {
  if (numPlayers !== 2 || players.length < 2 || !players[0].alive || !players[1].alive) {
    fusionOn = false; fusionT = 0;
    return;
  }
  var p0 = players[0], p1 = players[1];
  var dx = p0.x - p1.x, dy = p0.y - p1.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (fusionOn) {
    if (d > 110) { fusionOn = false; fusionT = 0; }
  } else if (d < 70) {
    fusionT += dt;
    if (fusionT >= 0.6) {
      fusionOn = true;
      waveBanner('FUSION!');
      sfxFusion();
      explode((p0.x + p1.x) / 2, (p0.y + p1.y) / 2, 18, false);
    }
  } else {
    fusionT = Math.max(0, fusionT - dt * 2);
  }
}
/* 合体技：电弧链 —— 两船之间电弧上的敌人持续掉血 */
function updateFusionArc(dt) {
  if (!bothWeapon('blue')) return;
  var p0 = players[0], p1 = players[1];
  var dps = 120 + 30 * (p0.lvl + p1.lvl);
  for (var j = 0; j < enemies.length; j++) {
    var e = enemies[j];
    if (e.dead) continue;
    for (var i = 0; i <= 8; i++) {
      var f = i / 8;
      var sx = p0.x + (p1.x - p0.x) * f;
      var sy = p0.y + (p1.y - p0.y) * f;
      var dx = e.x - sx, dy = e.y - sy, rr = e.r + 15;
      if (dx * dx + dy * dy < rr * rr) {
        damageEnemy(e, dps * dt, sx, sy + 30);
        if (Math.random() < dt * 14) spark(sx + rand(-4, 4), sy + rand(-4, 4));
        break;
      }
    }
  }
}
/* 水雷更新：漂移，玩家靠近或 5 秒后爆炸为环形弹 */
function updateMines(dt) {
  for (var i = mines.length - 1; i >= 0; i--) {
    var m = mines[i];
    m.t += dt;
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.vx *= (1 - dt * 0.4); m.vy *= (1 - dt * 0.4);
    if (m.y > H + 24) { mines.splice(i, 1); continue; }
    var boom = m.t >= 5;
    if (!boom) {
      for (var pi = 0; pi < players.length; pi++) {
        var p = players[pi];
        if (!p.alive) continue;
        var dx = m.x - p.x, dy = m.y - p.y;
        if (dx * dx + dy * dy < 50 * 50) { boom = true; break; }
      }
    }
    if (boom) {
      explode(m.x, m.y, 16);
      sfxBoom(false);
      var n = 8;
      for (var k = 0; k < n; k++) {
        var a = k * (TAU / n) + 0.2;
        eShoot(m.x, m.y, a, 96 * df(), 0, 'orb');
      }
      mines.splice(i, 1);
    }
  }
}
function updatePlaying(dt) {
  gameT += dt;
  updateStars(dt, 1);
  waveT += dt;
  var i, j, e;
  for (i = 0; i < events.length; i++) {
    if (!events[i].done && events[i].t <= waveT) { events[i].done = true; events[i].fn(); }
  }
  var allDone = true;
  for (i = 0; i < events.length; i++) if (!events[i].done) { allDone = false; break; }
  if (allDone && enemies.length === 0) {
    interT += dt;
    if (interT > 1.6) {
      interT = 0;
      if (stageClearPending) {
        /* 关底 Boss 已击破：非最终关 -> 解锁下一关并进入关间过场；最终关 -> 通关结算 */
        stageClearPending = false;
        if (stage < STAGE_COUNT) {
          unlockStage(stage + 1);
          beginIntermission(stage + 1);
          return;
        }
        victoryPending = true;
      }
      if (victoryPending) {
        victoryPending = false;
        setMode('victory');
        victoryT = 0; fwT = 0;
        if (!godMode) { try { localStorage.setItem('thunder-strike-hi', String(hi)); } catch (err) {} }
        maybeNameEntry('victory'); /* 上榜则先进入街机留名界面 */
        sfxFanfare();
      } else {
        wave++;
        startWave(wave);
      }
    }
  } else interT = 0;

  updateFusion(dt);
  /* 合体技：全向弹幕 —— 双散射合体时周期性释放 360° 径向弹幕环 */
  if (bothWeapon('spr')) {
    fusionFireT -= dt;
    if (fusionFireT <= 0) { fireFusionRing(); fusionFireT = 0.75; }
  }

  /* players */
  for (var pi = 0; pi < players.length; pi++) {
    var p = players[pi];
    if (!p.alive) continue;
    if (p.inv > 0) p.inv -= dt;
    if (p.shieldT > 0) p.shieldT -= dt;
    var mv = playerMoveVector(p);
    if (mv.x || mv.y) {
      var l = Math.hypot(mv.x, mv.y);
      p.x = clamp(p.x + mv.x / l * 272 * dt, 16, W - 16);
      p.y = clamp(p.y + mv.y / l * 272 * dt, H * 0.2, H - 24);
    }
    p.bank += (mv.x - p.bank) * Math.min(1, dt * 10);
    /* 引擎粒子尾焰 */
    if (!reduceMotion && Math.random() < dt * 55) {
      var skin = PLAYER_SKINS[p.id % 2];
      parts.push({ x: p.x + rand(-3, 3), y: p.y + 13, vx: rand(-10, 10), vy: rand(60, 120), life: rand(0.16, 0.3), max: 0.3, size: rand(1, 2.4), c: skin.flameCss });
    }
    p.fireT -= dt;
    if (p.weapon === 'red') {
      if (bothWeapon('red')) {
        /* 超级火神炮由 1P 统一从合体点发射 */
        if (p.id === 0 && p.fireT <= 0) { fireSuperVulcan(); p.fireT = 0.11; }
      } else if (p.fireT <= 0) { fireRed(p); p.fireT = 0.12 * rateMul(); } /* 平行弹道全覆盖后射速微升，总 DPS 较原版约 +8% */
    } else if (p.weapon === 'blue') {
      updateWhip(p, dt);
    } else if (p.weapon === 'spr') {
      if (p.fireT <= 0) { fireSpr(p); p.fireT = 0.24 * rateMul(); }
    }
    /* 限时追踪导弹副火力：与主武器并行开火，时间到自动消失 */
    if (p.homT > 0) {
      p.homT -= dt;
      p.homFireT -= dt;
      if (p.homFireT <= 0) { fireHoming(p); p.homFireT = 0.32; }
      if (p.homT <= 0) {
        p.homT = 0;
        floats.push({ x: p.x, y: p.y - 26, text: '追踪导弹结束', t: 0.9 });
      }
    }
  }
  updateFusionArc(dt);
  updateMissiles(dt);
  updateMines(dt);

  /* player bullets */
  for (i = bullets.length - 1; i >= 0; i--) {
    var b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -14 || b.y > H + 14 || b.x < -14 || b.x > W + 14) { bullets.splice(i, 1); continue; }
    for (j = 0; j < enemies.length; j++) {
      e = enemies[j];
      if (e.dead) continue;
      var dx = b.x - e.x, dy = b.y - e.y, rr = e.r + 3;
      if (dx * dx + dy * dy < rr * rr) {
        damageEnemy(e, b.dmg, b.x, b.y);
        spark(b.x, b.y);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  /* enemies */
  for (i = 0; i < enemies.length; i++) {
    e = enemies[i];
    if (e.dead) continue;
    if (e.hitT > 0) e.hitT -= dt;
    e.t += dt;
    if (e.type === 'fighter') {
      if (e.vx) { e.x += e.vx * dt; e.y += e.vy * dt; }
      else { e.x += Math.sin(e.t * 2 + e.phase) * 42 * dt; e.y += e.vy * dt; }
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 0 && e.y < H * 0.7) { aimed(e.x, e.y + 8, 158 * df()); e.fireT = rand(1.4, 2.2) / Math.min(df(), 1.4); }
      if (e.y > H + 40 || e.x < -60 || e.x > W + 60) e.gone = true;
      if (!reduceMotion && Math.random() < dt * 22) parts.push({ x: e.x, y: e.y - 10, vx: 0, vy: -30, life: 0.22, max: 0.22, size: 1.8, c: '#ff7a5a' });
    } else if (e.type === 'weaver') {
      e.x += e.dir * 172 * dt;
      e.y = e.baseY + Math.sin(e.t * 2.6) * 46;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.x > 0 && e.x < W) { aimed(e.x, e.y, 150 * df()); e.fireT = rand(2.0, 3.0); }
      if (e.x < -50 || e.x > W + 50) e.gone = true;
      if (!reduceMotion && Math.random() < dt * 20) parts.push({ x: e.x - e.dir * 10, y: e.y, vx: -e.dir * 30, vy: 0, life: 0.2, max: 0.2, size: 1.6, c: '#7aff9a' });
    } else if (e.type === 'gunboat') {
      if (e.y < e.stopY) e.y += 44 * dt;
      else { e.mt += dt; e.x = clamp(e.baseX + Math.sin(e.mt * 0.7) * 84, 30, W - 30); } /* 游走改用 e.mt，修复入场->游走横向瞬移 */
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 0) {
        e.n++;
        if (e.n % 2 === 0 && wave >= 2) {
          for (var k = 0; k < 10; k++) eShoot(e.x, e.y, k * (TAU / 10) + e.t, 112 * df());
        } else {
          var a1 = Math.atan2(nearestPlayer(e.x, e.y).y - e.y, nearestPlayer(e.x, e.y).x - e.x);
          for (var s = -1; s <= 1; s++) eShoot(e.x, e.y + 10, a1 + s * 0.17, 172 * df());
        }
        e.fireT = 1.7 / Math.min(df(), 1.5);
      }
    } else if (e.type === 'carrier') {
      e.y += e.vy * dt;
      e.x += Math.sin(e.t * 2) * 18 * dt;
      if (e.y > H + 40) e.gone = true;
    } else if (e.type === 'kamikaze') {
      /* 神风：下降 -> 锁定 0.35s -> 加速俯冲，靠近玩家自爆 */
      if (e.state === 0) {
        e.y += 74 * dt;
        if (e.y > 30 || e.t > 0.9) { e.state = 1; e.aimT = 0.35; }
      } else if (e.state === 1) {
        e.y += 30 * dt;
        e.aimT -= dt;
        var kp = nearestPlayer(e.x, e.y);
        e.lockA = Math.atan2(kp.y - e.y, kp.x - e.x);
        if (e.aimT <= 0) { e.state = 2; e.sp = 200; }
      } else {
        e.sp = Math.min(430, e.sp + 340 * dt);
        var kp2 = nearestPlayer(e.x, e.y);
        var des = Math.atan2(kp2.y - e.y, kp2.x - e.x);
        e.lockA = angleLerp(e.lockA, des, 1.6 * dt);
        e.x += Math.cos(e.lockA) * e.sp * dt;
        e.y += Math.sin(e.lockA) * e.sp * dt;
        if (!reduceMotion && Math.random() < dt * 50) parts.push({ x: e.x, y: e.y, vx: rand(-10, 10), vy: rand(-10, 10), life: 0.24, max: 0.24, size: 2, c: '#ff9a5a' });
        if (kp2.alive) {
          var kdx = e.x - kp2.x, kdy = e.y - kp2.y;
          if (kdx * kdx + kdy * kdy < 34 * 34) {
            damageEnemy(e, 999);
            playerHit(kp2);
          }
        }
      }
      if (e.y > H + 40 || e.x < -50 || e.x > W + 50 || e.y < -60) e.gone = true;
    } else if (e.type === 'sniper') {
      /* 狙击炮塔：入场悬停，蓄力 1.6s 后发射快速长弹 */
      if (e.y < e.stopY) e.y += 50 * dt;
      else {
        e.mt += dt; /* 游走改用 e.mt，修复入场->游走横向瞬移 */
        e.x = clamp(e.baseX + Math.sin(e.mt * 0.5) * 46, 26, W - 26);
        e.chargeT += dt;
        if (e.chargeT >= 1.6) {
          e.chargeT = 0;
          var sp2 = nearestPlayer(e.x, e.y);
          var sa = Math.atan2(sp2.y - e.y, sp2.x - e.x);
          eShoot(e.x, e.y + 12, sa, 395 * df(), 0, 'lance');
          sfxSnipe();
        }
      }
    } else if (e.type === 'shielder') {
      /* 护盾兵：缓慢下压，间歇发射大型慢速弹；破盾硬直期间停摆 */
      if (e.stunT > 0) {
        e.stunT -= dt;
      } else {
        if (e.y < e.stopY) e.y += e.vy * dt;
        else e.x += Math.sin(e.t * 0.8) * 24 * dt;
        e.fireT -= dt;
        if (e.fireT <= 0 && e.y > 0) {
          var hp2 = nearestPlayer(e.x, e.y);
          var ha = Math.atan2(hp2.y - e.y, hp2.x - e.x);
          eShoot(e.x, e.y + 14, ha, 88 * df(), 0, 'orb');
          e.fireT = rand(2.4, 3.4);
        }
      }
      /* 4s 无盾脆弱期结束 -> 护盾恢复满 */
      if (e.shieldDownT > 0) {
        e.shieldDownT -= dt;
        if (e.shieldDownT <= 0) e.shieldHp = e.shMax;
      }
      if (e.y > H + 40) e.gone = true;
    } else if (e.type === 'minelayer') {
      /* 布雷机：蛇形前进，沿途布设感应水雷 */
      e.y += e.vy * dt;
      e.x = clamp(e.baseX + Math.sin(e.t * 1.3) * 70, 24, W - 24);
      e.mineT -= dt;
      if (e.mineT <= 0 && e.laid < 5 && e.y > 24 && e.y < H * 0.6) {
        dropMine(e.x, e.y + 12);
        e.laid++;
        e.mineT = 1.3;
      }
      if (e.y > H + 40) e.gone = true;
    } else if (e.type === 'boss') {
      updateBoss(e, dt);
    }
    /* crash into players */
    for (pi = 0; pi < players.length; pi++) {
      var cp = players[pi];
      if (!cp.alive || cp.inv > 0 || e.dead) continue;
      var cdx = e.x - cp.x, cdy = e.y - cp.y, crr = e.r + cp.r - 3;
      if (cdx * cdx + cdy * cdy < crr * crr) {
        damageEnemy(e, 12, cp.x, cp.y);
        playerHit(cp);
      }
    }
  }
  enemies = enemies.filter(function (e2) { return !e2.dead && !e2.gone; });

  /* enemy bullets */
  for (i = ebullets.length - 1; i >= 0; i--) {
    var eb = ebullets[i];
    eb.t += dt;
    if (eb.homing) {
      var hp = nearestPlayer(eb.x, eb.y);
      if (hp.alive) {
        var cur = Math.atan2(eb.vy, eb.vx);
        var des2 = Math.atan2(hp.y - eb.y, hp.x - eb.x);
        cur = angleLerp(cur, des2, eb.homing * dt);
        var sp = Math.hypot(eb.vx, eb.vy);
        eb.vx = Math.cos(cur) * sp;
        eb.vy = Math.sin(cur) * sp;
      }
    }
    eb.x += eb.vx * dt; eb.y += eb.vy * dt;
    if (eb.y < -16 || eb.y > H + 16 || eb.x < -16 || eb.x > W + 16) { ebullets.splice(i, 1); continue; }
    for (pi = 0; pi < players.length; pi++) {
      var pp = players[pi];
      if (!pp.alive || pp.inv > 0) continue;
      var pdx = eb.x - pp.x, pdy = eb.y - pp.y, prr = pp.r - 2 + eb.r;
      if (pdx * pdx + pdy * pdy < prr * prr) {
        ebullets.splice(i, 1);
        playerHit(pp);
        break;
      }
    }
  }

  /* items */
  for (i = items.length - 1; i >= 0; i--) {
    var it = items[i];
    it.t += dt;
    it.y += it.vy * dt;
    it.x += Math.sin(it.t * 2.2) * 14 * dt;
    if (it.y > H + 20) { items.splice(i, 1); continue; }
    for (pi = 0; pi < players.length; pi++) {
      var ip = players[pi];
      if (!ip.alive) continue;
      var idx = it.x - ip.x, idy = it.y - ip.y;
      if (idx * idx + idy * idy < 28 * 28) {
        collectItem(ip, it);
        items.splice(i, 1);
        break;
      }
    }
  }

  updateFx(dt);
}

function updateFx(dt) {
  if (parts.length > 900) parts.splice(0, parts.length - 900); /* 粒子数兜底 */
  if (floats.length > 48) floats.splice(0, floats.length - 48); /* 浮字数兜底（防密集击坠时刷屏泄漏） */
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.ring) { p.r += p.vr * dt; }
    else {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= (1 - dt * 2); p.vy *= (1 - dt * 2);
      if (p.debris) p.rot += p.spin * dt;
    }
  }
  for (i = floats.length - 1; i >= 0; i--) {
    var f = floats[i];
    f.t -= dt;
    f.y -= 26 * dt;
    if (f.t <= 0) floats.splice(i, 1);
  }
  if (banner.t > 0) banner.t -= dt;
  if (warnFxT > 0) warnFxT -= dt;
  if (flash > 0) flash -= dt * 1.8;
  if (shakeT > 0) shakeT -= dt * 1.6;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) comboCount = 0; }
}

function updateAmbient(dt) {
  updateStars(dt, 0.4);
  updateFx(dt);
  if (mode === 'gameover') gameoverT += dt;
  if (mode === 'victory') {
    victoryT += dt;
    fwT -= dt;
    if (fwT <= 0) {
      fwT = rand(0.28, 0.55);
      explode(rand(60, W - 60), rand(50, H * 0.5), 22, true);
      if (Math.random() < 0.5) sfxBoom(false);
    }
  }
}

/* ---------------- draw ---------------- */
var PLAYER_SKINS = [
  { hull: '#d8ecff', hullHi: '#ffffff', hullLo: '#7aa8cc', accent: '#39c0ff', cockpit: '#0a2a40', flame: '120,200,255', flameCss: '#7ac8ff' },
  { hull: '#ffe0c0', hullHi: '#fff6e8', hullLo: '#cc8a5a', accent: '#ff9a3a', cockpit: '#40200a', flame: '255,160,80', flameCss: '#ffb060' }
];
function drawPlayer(p) {
  if (!p.alive) return;
  if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0 && mode === 'playing') return;
  var skin = PLAYER_SKINS[p.id % 2];
  var now = performance.now();
  ctx.save();
  ctx.translate(p.x, p.y);

  fg.addColorStop(0, 'rgba(' + skin.flame + ',0.95)');
  fg.addColorStop(0.5, 'rgba(' + skin.flame + ',0.45)');
  fg.addColorStop(1, 'rgba(' + skin.flame + ',0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-4, 12); ctx.lineTo(4, 12); ctx.lineTo(0, 12 + 16 * flick);
  ctx.closePath(); ctx.fill();
  /* 机身：顶部高光渐变 */
  var hg = ctx.createLinearGradient(0, -17, 0, 13);
  hg.addColorStop(0, skin.hullHi);
  hg.addColorStop(0.55, skin.hull);
  hg.addColorStop(1, skin.hullLo);
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(0, -17);
  ctx.lineTo(-4, -4); ctx.lineTo(-16, 7); ctx.lineTo(-16, 11); ctx.lineTo(-5, 8);
  ctx.lineTo(-3, 13); ctx.lineTo(3, 13); ctx.lineTo(5, 8);
  ctx.lineTo(16, 11); ctx.lineTo(16, 7); ctx.lineTo(4, -4);
  ctx.closePath(); ctx.fill();
  /* 机背高光条 */
  ctx.fillStyle = skin.accent;
  ctx.beginPath();
  ctx.moveTo(0, -17); ctx.lineTo(-3, -2); ctx.lineTo(3, -2);
  ctx.closePath(); ctx.fill();
  /* 座舱发光 */
  var cg = ctx.createRadialGradient(0, -5, 0.5, 0, -5, 6);
  cg.addColorStop(0, 'rgba(180,240,255,0.95)');
  cg.addColorStop(0.5, skin.cockpit);
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(0, -5, 3.2, 6, 0, 0, TAU);
  ctx.fill();
  /* 机翼灯：左红右绿交替闪烁 */
  var blink = Math.floor(now / 300 + p.id) % 2 === 0;
  ctx.fillStyle = blink ? '#ff4a4a' : 'rgba(255,74,74,0.3)';
  ctx.beginPath(); ctx.arc(-15, 9, 1.6, 0, TAU); ctx.fill();
  ctx.fillStyle = blink ? 'rgba(80,255,140,0.3)' : '#50ff8c';
  ctx.beginPath(); ctx.arc(15, 9, 1.6, 0, TAU); ctx.fill();
  if (numPlayers === 2) {
    ctx.fillStyle = skin.accent;
    ctx.font = 'bold 9px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('P' + (p.id + 1), 0, 26);
  }
  ctx.restore();
}
/* 玩家附加视觉：限时导弹倒计时圆弧 + 临时护盾泡泡 */
function drawPlayerExtras(p) {
  if (!p.alive || mode !== 'playing') return;
  var now = performance.now();
  /* 限时追踪导弹：头顶倒计时圆弧（上限 30s），最后 3 秒闪烁 */

    ctx.strokeStyle = 'rgba(122,223,90,0.25)';
    ctx.lineWidth = 3;

    ctx.closePath(); ctx.fill();
  }
  /* 临时护盾：泡泡 + 旋转六边形闪光，快结束时闪烁 */
  if (p.shieldT > 0 && (p.shieldT > 1.5 || Math.floor(now / 110) % 2 === 0)) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var rr2 = 20 + Math.sin(now / 130) * 2;
    ctx.strokeStyle = 'rgba(90,230,255,0.7)';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(p.x, p.y, rr2, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,250,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, rr2 + 3, 0, TAU); ctx.stroke();

    ctx.strokeStyle = 'rgba(140,240,255,0.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = now / 900 + i * TAU / 6;
      var hx2 = p.x + Math.cos(a) * (rr2 + 6), hy2 = p.y + Math.sin(a) * (rr2 + 6);
      if (i === 0) ctx.moveTo(hx2, hy2); else ctx.lineTo(hx2, hy2);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
}
function drawMissiles() {
  for (var i = 0; i < missiles.length; i++) {
    var m = missiles[i];
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.ang + Math.PI / 2);

    ctx.closePath(); ctx.fill();

    ctx.fillRect(-1.5, 0, 3, 4);

}

    ctx.beginPath(); ctx.arc(-r.r * 0.25, -r.r * 0.25, r.r * 0.5, 0, TAU); ctx.fill();

}
function drawLavaGlow() {

  g.addColorStop(0, 'rgba(255,96,20,0.5)');
  g.addColorStop(0.5, 'rgba(190,45,10,0.2)');
  g.addColorStop(1, 'rgba(120,20,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2a0a05';
  ctx.beginPath(); ctx.ellipse(W / 2, H + 132, 400, 130, 0, Math.PI, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,120,40,0.55)';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.ellipse(W / 2, H + 132, 400, 130, 0, Math.PI + 0.35, TAU - 0.35); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,90,30,' + (0.14 + 0.08 * Math.sin(bgTime * 2.2)) + ')';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W * 0.2, H - 40); ctx.quadraticCurveTo(W * 0.5, H - 18, W * 0.8, H - 46);
  ctx.stroke();
}
function drawRings() {
  for (var i = 0; i < rings.length; i++) {
    var rg = rings[i];
    ctx.save();
    ctx.translate(rg.x, rg.y);
    ctx.scale(1, rg.tilt);
    /* 巨型环状遗迹：断续弧段缓速旋转 */
    for (var seg = 0; seg < 4; seg++) {
      var a0 = rg.rot + seg * TAU / 4;
      ctx.strokeStyle = seg % 2 ? 'rgba(60,220,170,0.34)' : 'rgba(30,140,110,0.5)';
      ctx.lineWidth = rg.w;
      ctx.beginPath();
      ctx.arc(0, 0, rg.r, a0, a0 + TAU / 4 * 0.62);
      ctx.stroke();
    }
    /* 环上光点 */
    ctx.fillStyle = 'rgba(150,255,215,0.7)';
    for (seg = 0; seg < 3; seg++) {
      var a = rg.rot * 1.6 + seg * TAU / 3;
      ctx.beginPath(); ctx.arc(Math.cos(a) * rg.r, Math.sin(a) * rg.r, 2.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}
function drawMothership() {
  /* 远景敌方母舰剪影：缓慢横移的巨大黑影 + 微弱紫色舷灯 */
  var mx = W / 2 + Math.sin(bgTime * 0.07) * 56;
  var my = H * 0.13 + Math.sin(bgTime * 0.11) * 6;
  ctx.save();
  ctx.translate(mx, my);
  ctx.fillStyle = 'rgba(10,5,20,0.88)';
  ctx.beginPath(); ctx.ellipse(0, 0, 150, 26, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -12, 60, 16, 0, Math.PI, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(150,80,255,0.28)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(0, 0, 150, 26, 0, 0.15, Math.PI - 0.15); ctx.stroke();
  for (var i = 0; i < 7; i++) {
    var blink = Math.floor(bgTime * 2 + i) % 3 === 0;
    ctx.fillStyle = blink ? 'rgba(190,120,255,0.8)' : 'rgba(120,60,200,0.25)';
    ctx.beginPath(); ctx.arc(-96 + i * 32, 6, 2, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawBackground() {
  /* 标题/设置/排行榜等界面固定第 1 关主题；关卡选择界面预览所选关主题 */
  var bgStage = mode === 'stageselect' ? stageSel
    : (mode === 'title' || mode === 'settings' || mode === 'scores' || mode === 'nameentry') ? 1 : stage;
  var bg = STAGES[bgStage - 1].bg;
  ensureScenery();
  ctx.fillStyle = bg.sky;
  ctx.fillRect(0, 0, W, H);
  var ng = ctx.createRadialGradient(W * 0.7, H * 0.3, 20, W * 0.7, H * 0.3, 320);
  ng.addColorStop(0, 'rgba(' + bg.neb + ',' + bg.nebA + ')');
  ng.addColorStop(1, 'rgba(' + bg.neb + ',0)');
  ctx.fillStyle = ng;
  ctx.fillRect(0, 0, W, H);
  if (bg.mothership) drawMothership();
  if (bg.rings) drawRings();
  for (var l = 0; l < 3; l++) {
    if (bg.warp) {
      /* 虚空核心空间扭曲：星点沿运动方向拉长，并绕画面中心带螺旋分量 */
      ctx.strokeStyle = 'rgba(' + bg.star + ',' + stars[l][0].a + ')';
      ctx.lineWidth = stars[l][0].sz;
      ctx.beginPath();
      for (var i = 0; i < stars[l].length; i++) {
        var s = stars[l][i];
        var bx = s.x - W / 2, by = s.y - H / 2;
        var dd = Math.hypot(bx, by) || 1;
        var tl = dd * 0.014 + s.sz * 2.4;
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - by / dd * tl, s.y + bx / dd * tl * 0.4 + s.sz * 2.2);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(' + bg.star + ',' + stars[l][0].a + ')';
      for (i = 0; i < stars[l].length; i++) {
        var s2 = stars[l][i];
        ctx.fillRect(s2.x, s2.y, s2.sz, s2.sz);
      }
    }
  }
  if (bg.rocks) drawRocks();
  if (bg.lava) drawLavaGlow();
}
function draw() {
  drawBackground();
  var i;
  ctx.save();
  if (shakeT > 0 && !reduceMotion) ctx.translate(rand(-1, 1) * shakeT * 12, rand(-1, 1) * shakeT * 12);
  for (i = 0; i < items.length; i++) drawItem(items[i]);
  for (i = 0; i < mines.length; i++) drawMine(mines[i]);
  for (i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
  for (i = 0; i < players.length; i++) { drawWhip(players[i]); drawPlayer(players[i]); drawPlayerExtras(players[i]); }
  drawFusionLink();
  drawMissiles();
  for (i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    ctx.fillStyle = b.c || '#ff7a4d';
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, 3, 8, Math.atan2(b.vy, b.vx) + Math.PI / 2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = b.c ? '#fff6d0' : '#ffe0c0';
    ctx.fillRect(b.x - 1, b.y - 4, 2, 8);
  }
  /* 敌方子弹：按类型区分视觉（lance 快速长弹 / orb 大型慢速弹 / std 普通） */
  for (i = 0; i < ebullets.length; i++) {
    var eb = ebullets[i];
    if (eb.kind === 'lance') {
      var la = Math.atan2(eb.vy, eb.vx);
      ctx.save();
      ctx.translate(eb.x, eb.y);
      ctx.rotate(la);
      ctx.fillStyle = 'rgba(120,220,255,0.55)';
      ctx.fillRect(-14, -3, 28, 6);
      var lg = ctx.createLinearGradient(-14, 0, 10, 0);
      lg.addColorStop(0, 'rgba(120,220,255,0)');
      lg.addColorStop(1, '#eafaff');
      ctx.fillStyle = lg;
      ctx.fillRect(-14, -1.6, 26, 3.2);
      ctx.restore();
    } else if (eb.kind === 'orb') {
      var pulse2 = 1 + Math.sin(eb.t * 6) * 0.12;
      ctx.fillStyle = 'rgba(160,90,255,0.4)';
      ctx.beginPath(); ctx.arc(eb.x, eb.y, 11 * pulse2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#b05aff';
      ctx.beginPath(); ctx.arc(eb.x, eb.y, 7.5 * pulse2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#f0dcff';
      ctx.beginPath(); ctx.arc(eb.x, eb.y, 3.4, 0, TAU); ctx.fill();
    } else {
      var pr = eb.r + Math.sin(eb.t * 10) * 0.8;
      if (eb.homing) {
        ctx.fillStyle = '#8aff5a';
        ctx.beginPath(); ctx.arc(eb.x, eb.y, pr + 2, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e0ffd0';
      } else {
        ctx.fillStyle = eb.c || '#ff5ad0'; /* 关卡主题弹色（默认品红） */
        ctx.beginPath(); ctx.arc(eb.x, eb.y, pr + 2, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ffd7f5';
      }
      ctx.beginPath(); ctx.arc(eb.x, eb.y, pr - 1.4, 0, TAU); ctx.fill();
    }
  }
  for (i = 0; i < parts.length; i++) {
    var p2 = parts[i];
    var al = clamp(p2.life / p2.max, 0, 1);
    if (p2.ring) {
      ctx.strokeStyle = 'rgba(' + (p2.cc || '255,220,150') + ',' + al * 0.8 + ')';
      ctx.lineWidth = 3 * al;
      ctx.beginPath(); ctx.arc(p2.x, p2.y, p2.r, 0, TAU); ctx.stroke();
    } else if (p2.debris) {
      /* 彩色碎屑：旋转小方块 */
      ctx.save();
      ctx.globalAlpha = al;
      ctx.translate(p2.x, p2.y);
      ctx.rotate(p2.rot);
      ctx.fillStyle = p2.c;
      ctx.fillRect(-p2.size / 2, -p2.size / 2, p2.size, p2.size);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = al;
      ctx.fillStyle = p2.c;
      ctx.fillRect(p2.x - p2.size / 2, p2.y - p2.size / 2, p2.size, p2.size);
      ctx.globalAlpha = 1;
    }
  }
  /* 炸弹放射光束 */
  if (bombBlast) {
    var bt = clamp(bombBlast.t / bombBlast.max, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(bombBlast.x, bombBlast.y);
    ctx.rotate((1 - bt) * 1.2);
    for (i = 0; i < 12; i++) {
      var ba = i * TAU / 12;
      var bl2 = (1 - bt) * 260 + 90;
      var bg4 = ctx.createLinearGradient(0, 0, Math.cos(ba) * bl2, Math.sin(ba) * bl2);
      bg4.addColorStop(0, 'rgba(255,255,255,' + 0.85 * bt + ')');
      bg4.addColorStop(1, 'rgba(140,200,255,0)');
      ctx.strokeStyle = bg4;
      ctx.lineWidth = 3.2 * bt + 0.6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ba) * 12, Math.sin(ba) * 12);
      ctx.lineTo(Math.cos(ba) * bl2, Math.sin(ba) * bl2);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,' + 0.7 * bt + ')';
    ctx.beginPath(); ctx.arc(0, 0, 26 * (1 - bt) + 8, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.font = 'bold 13px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'center';
  for (i = 0; i < floats.length; i++) {
    var f = floats[i];
    ctx.globalAlpha = clamp(f.t, 0, 1);
    if (f.combo) {
      ctx.fillStyle = '#6af0ff';
      ctx.font = 'bold 15px ui-monospace, Menlo, Consolas, monospace';
    } else {
      ctx.fillStyle = '#ffe9a0';
      ctx.font = 'bold 13px ui-monospace, Menlo, Consolas, monospace';
    }
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,245,220,' + clamp(flash, 0, 1) * 0.75 + ')';
    ctx.fillRect(0, 0, W, H);
  }
  /* Boss 登场 WARNING：全屏红色脉冲暗角，随警报节奏呼吸 3 次 */
  if (warnFxT > 0) {
    var wt = 2.4 - warnFxT;
    var breath = Math.pow(Math.abs(Math.sin(wt * Math.PI / 0.8)), 1.4);
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.75);
    vg.addColorStop(0, 'rgba(140,0,0,0)');
    vg.addColorStop(1, 'rgba(190,12,12,' + (0.14 + 0.4 * breath) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,40,30,' + 0.28 * breath + ')';
    ctx.fillRect(0, 0, W, 5);
    ctx.fillRect(0, H - 5, W, 5);
  }
  drawHud();
  if (mode === 'title') drawTitle();
  else if (mode === 'stageselect') drawStageSelect();
  else if (mode === 'settings') drawSettings();
  else if (mode === 'scores') drawScores();
  else if (mode === 'nameentry') drawNameEntry();
  else if (mode === 'intermission') drawIntermission();
  else if (mode === 'paused') drawPause();
  else if (mode === 'gameover') drawGameover();
  else if (mode === 'victory') drawVictory();
}
/* HUD 武器栏：彩色小图标 + 中文名 + 等级圆点 */
function drawWeaponHud(p, alignRight) {
  var wCol = p.weapon === 'red' ? '#ff8a6a' : p.weapon === 'blue' ? '#c09aff' : '#ffd24a';
  var x0 = alignRight ? W - 12 : 12;
  var dir = alignRight ? -1 : 1;
  /* 彩色小图标 */
  ctx.save();
  ctx.translate(x0 + dir * 9, 38);
  drawWeaponGlyph(p.weapon, 0.85);
  ctx.restore();
  ctx.fillStyle = wCol;
  ctx.font = 'bold 13px "PingFang SC", system-ui, sans-serif';
  ctx.textAlign = alignRight ? 'right' : 'left';
  var label = (numPlayers === 2 ? 'P' + (p.id + 1) + ' ' : '') + WEAPON_NAMES[p.weapon];
  ctx.fillText(label, x0 + dir * 22, 42);
  /* 等级圆点 */
  for (var i = 0; i < p.lvl; i++) {
    ctx.beginPath();
    ctx.arc(x0 + dir * (8 + i * 11), 52, 3, 0, TAU);

  }

function drawHud() {
  if (mode === 'title' || mode === 'stageselect' || mode === 'settings' || mode === 'scores') return;
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 15px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#cfe0ff';
  ctx.fillText('SCORE ' + String(score).padStart(8, '0'), 12, 22);
  ctx.textAlign = 'right';
  ctx.fillText('HI ' + String(hi).padStart(8, '0'), W - 12, 22);
  /* 顶部中央：难度（合体时让位给 FUSION） */
  ctx.textAlign = 'center';
  if (fusionOn) {
    var fp = 0.7 + Math.sin(performance.now() / 90) * 0.3;
    ctx.fillStyle = 'rgba(140,230,255,' + fp + ')';
    ctx.font = 'bold 17px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText('◆ FUSION ◆', W / 2, 22);
    ctx.font = 'bold 10px "PingFang SC", system-ui, sans-serif';
    ctx.fillStyle = '#9fb2d8';
    var fname = bothWeapon('red') ? '超级火神炮' : bothWeapon('blue') ? '电弧链' : bothWeapon('spr') ? '全向弹幕' : '协力强化 +50%';
    ctx.fillText(fname, W / 2, 38);
  } else {
    ctx.fillStyle = '#8fa2c8';
    ctx.font = 'bold 11px "PingFang SC", system-ui, sans-serif';
    ctx.fillText('ST' + stage + ' ' + stageConf().name + ' · ' + D().name + (endlessLoop > 0 ? ' · 无尽' + endlessLoop : ''), W / 2, 22);
  }
  if (players.length) drawWeaponHud(players[0], false);
  if (numPlayers === 2 && players[1]) drawWeaponHud(players[1], true);
  var boss = null;
  for (var i = 0; i < enemies.length; i++) if (enemies[i].type === 'boss') { boss = enemies[i]; break; }
  if (boss) {
    var bw = 220;
    ctx.fillStyle = 'rgba(80,20,20,0.8)';
    ctx.fillRect(W / 2 - bw / 2, 58, bw, 7);
    ctx.fillStyle = boss.phase === 3 ? '#ff2a30' : '#ff4040';
    ctx.fillRect(W / 2 - bw / 2, 58, bw * clamp(boss.hp / boss.maxhp, 0, 1), 7);
    ctx.font = 'bold 10px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb0a0';
    var bossNames = ['DESTROYER', 'CRAB MECH', 'MOTHERSHIP'];
    ctx.fillText((boss.name || bossNames[boss.kind]) + ' · P' + boss.phase, W / 2, 76);
  }
  /* P1 lives & bombs & frags: bottom-left */
  if (players.length) {
    var p1 = players[0];
    for (i = 0; i < p1.lives; i++) drawLifeIcon(20 + i * 22, H - 16, 0);
    for (i = 0; i < p1.bombs; i++) drawBombIcon(20 + i * 20, H - 38);
    for (i = 0; i < p1.frags; i++) drawFragIcon(20 + i * 16, H - 56);
  }
  /* P2 or shared-right side */
  if (numPlayers === 2 && players[1]) {
    var p2 = players[1];
    for (i = 0; i < p2.lives; i++) drawLifeIcon(W - 20 - i * 22, H - 16, 1);
    for (i = 0; i < p2.bombs; i++) drawBombIcon(W - 20 - i * 20, H - 38);
    for (i = 0; i < p2.frags; i++) drawFragIcon(W - 20 - i * 16, H - 56);
  }
  /* 底部中央：剩余续命次数 + 当前连击 */
  ctx.textAlign = 'center';
  ctx.font = 'bold 10px "PingFang SC", system-ui, sans-serif';
  ctx.fillStyle = '#7f92b8';
  ctx.fillText('续命 ×' + continuesLeft, W / 2, H - 8);
  if (comboCount >= 3 && comboT > 0) {
    ctx.fillStyle = '#6af0ff';
    ctx.font = 'bold 13px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText('COMBO x' + comboCount, W / 2, H - 26);
  }
  if (banner.t > 0) {
    var al = clamp(banner.t, 0, 1);
    var warn = banner.text === 'WARNING' || banner.text.indexOf('PHASE') === 0;
    var bx = W / 2, by = H * 0.38;
    if (banner.text === 'WARNING') {
      al *= Math.floor(banner.t * 6) % 2 === 0 ? 1 : 0.25;
      /* 字样抖动 */
      bx += rand(-2, 2);
      by += rand(-1.5, 1.5);
    }
    ctx.globalAlpha = al;
    ctx.font = 'bold 34px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = warn ? '#ff5040' : banner.text === 'FUSION!' ? '#6ae0ff' : '#cfe0ff';
    ctx.fillText(banner.text, bx, by);
    if (banner.text === 'WARNING') {
      /* 扫光：高亮带周期性扫过 WARNING 字样 */
      var swx = ((2.4 - banner.t) * 260) % (W + 240) - 120;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var sg2 = ctx.createLinearGradient(swx - 60, 0, swx + 60, 0);
      sg2.addColorStop(0, 'rgba(255,240,220,0)');
      sg2.addColorStop(0.5, 'rgba(255,240,220,0.55)');
      sg2.addColorStop(1, 'rgba(255,240,220,0)');
      ctx.fillStyle = sg2;
      ctx.fillText(banner.text, bx, by);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

function drawTitle() {

/* ---------------- 第二波：最高分榜写入 ---------------- */
function qualifiesScore() {
  return score > 0 && (scores.length < 10 || score > scores[scores.length - 1].s);
}
/* Game Over / 通关时若上榜则先进入街机留名界面；god 调试模式成绩不入榜 */
function maybeNameEntry(after) {
  if (godMode || !qualifiesScore()) return;
  neLetters = [0, 0, 0]; nePos = 0; neAfter = after;
  setMode('nameentry');
}
function finishNameEntry() {
  var nm = String.fromCharCode(65 + neLetters[0], 65 + neLetters[1], 65 + neLetters[2]);
  var now = new Date();
  var ds = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate();
  scores.push({ s: score, n: nm, stg: stage, start: startStage, d: ds });
  scores.sort(function (a, b) { return b.s - a.s; });
  scores = scores.slice(0, 10);
  saveScores();
  gameoverT = 0; victoryT = 0; fwT = 0;
  setMode(neAfter);
}
function drawGameover() {

  ctx.fillText(score >= hi && score > 0 ? '新纪录！' : '最高分 ' + hi, W / 2, H * 0.4 + 70);
  if (gameoverT > 0.8) {
    var blink = Math.floor(performance.now() / 480) % 2 === 0;
    if (continuesLeft > 0) {

}
function fmtTime(sec) {
  var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}

/* ---------------- dom sync ---------------- */
function syncDom() {
  oScore.textContent = score;
  oHi.textContent = hi;
  oWave.textContent = mode === 'title' ? '—' : ('ST' + stage + '-' + stageWave);
  if (players.length) {
    oLives.textContent = numPlayers === 2 && players[1] ? players[0].lives + ' / ' + players[1].lives : String(players[0].lives);
    oBombs.textContent = numPlayers === 2 && players[1] ? players[0].bombs + ' / ' + players[1].bombs : String(players[0].bombs);
    oWeapon.textContent = numPlayers === 2 && players[1]
      ? WEAPON_NAMES[players[0].weapon] + ' Lv' + players[0].lvl + ' / ' + WEAPON_NAMES[players[1].weapon] + ' Lv' + players[1].lvl
      : WEAPON_NAMES[players[0].weapon] + ' Lv' + players[0].lvl;
  } else {
    oLives.textContent = '3';
    oBombs.textContent = '3';
    oWeapon.textContent = '火神炮 Lv1';
  }
}

/* ---------------- 调试/录制钩子（仅供调试与录像使用，正常游玩请勿开启）----------------
   URL 参数：?stage=N  解锁并直接从第 N 关开局（1-4）
             &wave=M   从该关第 M 波开始（1-8）
             &god=1    无敌
             &mute=1   静音（录像用） */
var godMode = false;
(function debugHooks() {
  var q = '';
  try { q = (window.location && window.location.search) || ''; } catch (e) { return; }
  if (!q) return;
  var m, dbgStage = 0, dbgWave = 0;
  m = q.match(/[?&]stage=([1-4])/);
  /* 调试解锁仅本次会话生效，不写入 ts_unlock，避免污染正常通关进度 */
  if (m) { dbgStage = parseInt(m[1], 10); unlocked = Math.max(unlocked, dbgStage); }
  m = q.match(/[?&]wave=([1-8])/);
  if (m) dbgWave = parseInt(m[1], 10);
  if (/[?&]god=1/.test(q)) godMode = true;
  if (/[?&]mute=1/.test(q)) {
    soundOn = false; musOn = false;
    btnSound.textContent = '音效：关';
    btnMusic.textContent = '音乐：关';
    btnSound.setAttribute('aria-pressed', 'false');
    btnMusic.setAttribute('aria-pressed', 'false');
  }
  if (dbgStage) startGame(1, dbgStage, Math.max(1, dbgWave));
})();
/* 调试/测试接口：冒烟测试与录制脚本用，不影响正常游戏 */
try {
  window.__tsDebug = {
    STAGES: STAGES,
    info: function () {
      return { mode: mode, stage: stage, stageWave: stageWave, wave: wave, loop: endlessLoop, enemies: enemies.length, score: score, musTrack: musTrack, sky: stageConf().bg.sky, unlocked: unlocked, scores: scores.length, menuIdx: menuIdx };
    },
    clearWave: function () {
      for (var i = 0; i < enemies.length; i++) damageEnemy(enemies[i], 999999);
      for (var j = 0; j < events.length; j++) events[j].done = true;
    },
    addScore: function (n) { score += n; if (score > hi) hi = score; },
    hurt: function () { if (players[0]) { players[0].inv = 0; players[0].shieldT = 0; playerHit(players[0]); } }
  };
} catch (e) {}

/* ---------------- main loop ---------------- */
var last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  var raw = (now - last) / 1000;
  last = now;
  if (raw > 0.05) raw = 0.05;
  /* 炸弹慢动作：短暂 dt 缩放（真实时间衰减） */
  if (slowmoT > 0) slowmoT -= raw;
  var dt = slowmoT > 0 ? raw * 0.3 : raw;
  if (mode !== 'intermission') musTrack = desiredTrack(); /* 过场期间由交叉淡入逻辑切轨 */
  if (mode === 'playing') updatePlaying(dt);
  else updateAmbient(raw);
  if (mode === 'intermission') {
    intermT += raw;
    if (intermT >= 2.6) {
      wave++;
      startWave(wave);
      setMode('playing');
      cv.focus();
    }
  }
  whipHumUpdate(); /* 电浆鞭嗡嗡声状态机：playing/存活/蓝武 之外立即淡出停止 */
  if (bombBlast) { bombBlast.t -= raw; if (bombBlast.t <= 0) bombBlast = null; }
  draw();
  syncDom();
}
requestAnimationFrame(frame);
})();
</script>
